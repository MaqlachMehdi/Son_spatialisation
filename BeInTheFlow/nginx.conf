server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue retombe sur index.html (React gère le routage
    # côté client, s'il y en a un jour — pour l'instant une seule vue).
    location / {
        try_files $uri /index.html;
    }

    # "backend" = nom du service dans docker-compose.yml, résolu par le DNS
    # interne Docker (127.0.0.11) — jamais localhost, ce conteneur et le
    # backend sont deux processus séparés même sur la même machine hôte.
    #
    # proxy_pass avec un nom en dur ne résout le DNS qu'au démarrage de nginx :
    # si ce conteneur boote avant que "backend" soit prêt (redéploiement,
    # restart du backend), il reste figé en 502 jusqu'à un restart manuel.
    # Passer par une variable force nginx à re-résoudre à chaque requête via
    # le resolver Docker, avec un cache de 10s.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # proxy_pass sur une variable ne fait plus le strip automatique du
        # préfixe de location (contrairement à une URL littérale) : on le
        # fait nous-même. "break" arrête tout le module rewrite pour cette
        # requête — le "set" doit donc être placé AVANT, sinon il n'est
        # jamais exécuté ("uninitialized variable" à l'usage).
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
