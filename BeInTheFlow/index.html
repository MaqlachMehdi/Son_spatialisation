<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1d" />

         iOS ignore le manifest et se rabat sur un raccourci Safari classique. -->

    <meta name="apple-mobile-web-app-title" content="BeInTheFlow" />
    <title>BeInTheFlow</title>
  </head>
